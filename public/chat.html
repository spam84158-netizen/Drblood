<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat — Dr Blood IA VD-1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
</head>
<body data-page="chat">
  <script type="module" src="/js/firebase-auth.js"></script>
  <div id="nav-root"></div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="newChatBtn" class="btn-new-chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nouvelle conversation
        </button>
        <button id="closeSidebarBtn" class="btn-icon sidebar-close-mobile" aria-label="Fermer">✕</button>
      </div>
      <div class="conversation-list" id="conversationList"></div>
      <div class="sidebar-footer">
        <a href="/settings.html" class="btn-icon-text" style="text-decoration:none;">⚙️ Paramètres</a>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button id="openSidebarBtn" class="btn-icon sidebar-open-mobile" aria-label="Menu">☰</button>
        <h1 id="conversationTitle">Nouvelle conversation</h1>
        <div class="mode-switch" id="modeSwitch">
          <button type="button" class="mode-btn active" id="modeVD1Btn" data-mode="vd1">VD1</button>
          <button type="button" class="mode-btn" id="modeVD2Btn" data-mode="vd2">VD2</button>
        </div>
      </header>
      <p class="mode-hint" id="modeHint">Assistant généraliste — pose n'importe quelle question.</p>

      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <h2>Comment puis-je t'aider aujourd'hui ?</h2>
          <p>Écris ta question ci-dessous pour commencer.</p>
        </div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <textarea
            id="messageInput"
            placeholder="Écris ton message... (Entrée pour envoyer, Shift+Entrée pour un saut de ligne)"
            rows="1"
          ></textarea>
          <button id="stopBtn" class="btn-stop hidden" aria-label="Arrêter la génération">
            <svg width="16" height="16" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>
          </button>
          <button id="sendBtn" class="btn-send" aria-label="Envoyer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <p class="composer-hint">L'IA peut faire des erreurs. Vérifie les informations importantes.</p>
      </div>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Panneau d'aperçu de fichier généré par l'IA -->
  <div class="file-preview-overlay hidden" id="filePreviewOverlay">
    <div class="file-preview-panel">
      <div class="file-preview-header">
        <span class="file-preview-name" id="filePreviewName">fichier.txt</span>
        <div class="file-preview-actions">
          <a id="filePreviewDownload" class="btn-outline" download>Télécharger</a>
          <button id="filePreviewClose" class="btn-icon" aria-label="Fermer l'aperçu">✕</button>
        </div>
      </div>
      <div class="file-preview-body" id="filePreviewBody"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
